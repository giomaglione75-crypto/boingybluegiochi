<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percorsi Multipli: Il Mistero del Manoscritto Perduto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle, #f5f3ff 0%, #edd8fc 100%);
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        /* Effetto di micro-interazione in stile cartone animato */
        .pop-effect {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .pop-effect:hover {
            transform: scale(1.03) translateY(-2px);
        }
        .pop-effect:active {
            transform: scale(0.98) translateY(0);
        }
        .pulse-soft {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        /* Animazione d'ingresso fluida per le scene della storia */
        .fade-in-scene {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar arrotondata per l'area di testo */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

                ],
                type: "number-sequence-quiz",
                options: [
                    { text: "7", correct: false, next: "torre_step1_retry" },
                    { text: "8", correct: true, next: "torre_step2" },
                    { text: "9", correct: false, next: "torre_step1_retry" }
                ],
                progress: 30
            },

            torre_step1_retry: {

        let currentState = "intro";

        function renderScene(stateKey) {
            currentState = stateKey;
            const scene = gameData[stateKey];
            const container = document.getElementById("game-container");
            const boingyText = document.getElementById("boingy-text");
            const progressBarContainer = document.getElementById("progress-bar-container");
            const progressBar = document.getElementById("progress-bar");

            // Aggiornamento e animazione della barra di avanzamento grafica
            if (stateKey === "intro") {
                progressBarContainer.classList.add("hidden");
            } else {
                progressBarContainer.classList.remove("hidden");
                progressBar.style.width = `${scene.progress || 0}%`;
            }

            // Cambia dinamicamente i consigli didattici di Boingy in base alla scena corrente
            if (stateKey.includes("step1")) {
                boingyText.innerHTML = "Se gli occhi si stancano, <strong>sbattili forte per 3 volte</strong>! Poi ricomincia a contare lentamente, uno ad uno.";
            } else if (stateKey.includes("step2")) {
                boingyText.innerHTML = "Il ritmo è come una canzoncina! Canta i colori nella tua mente per trovare la gemma o la forma mancante senza fretta.";
            } else if (stateKey.includes("step3")) {
                boingyText.innerHTML = "Ricorda: non dobbiamo cliccare subito! Conta fino a tre e fai un respiro profondo prima di toccare la chiave o lo scrigno.";
            } else if (scene.isEnding) {
                boingyText.innerHTML = "Grande vittoria! Ti senti fiero di te? Fai un bel sorriso, il tuo cervello oggi ha fatto una ginnastica meravigliosa! ⭐";
            } else {
                boingyText.innerHTML = "Prenditi tutto il tempo che vuoi! Chiudi gli occhi, immagina la stanza e fai un bel respiro prima di scegliere la strada!";
            }

            // Iniezione con effetto di dissolvenza (fade-in)
            let html = `
                <div class="fade-in-scene">
                    <h3 class="font-game text-xl sm:text-2xl text-indigo-700 mb-3 tracking-wide">${scene.title}</h3>
                    <p class="text-sm sm:text-base text-slate-700 mb-4 leading-relaxed">${scene.text}</p>
            `;

            // Istruzioni visive e protette (Bullet points)
            if (scene.instructions && scene.instructions.length > 0) {
                html += `
                    <div class="bg-indigo-50 border-l-4 border-indigo-400 p-3 mb-4 rounded-r-xl shadow-sm">
                        <ul class="list-disc list-inside text-xs sm:text-sm text-indigo-950 space-y-1 font-medium">
                `;
                scene.instructions.forEach(inst => {
                    html += `<li>${inst}</li>`;
                });
                html += `
                        </ul>
                    </div>
                `;
            }

            // Condizioni per i differenti tipi di Quiz/Bivi Interattivi
            if (scene.type === "counting-quiz") {
                html += `
                    <div class="flex flex-wrap justify-center gap-3 mb-6 p-4 bg-white rounded-xl border border-slate-200 shadow-inner select-none">
                `;
                scene.items.forEach((emoji) => {
                    html += `
                        <div class="text-3xl sm:text-4xl transform transition-transform hover:scale-125 duration-100 p-1 cursor-pointer">
                            ${emoji}
                        </div>
                    `;
                });
                html += `
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                `;
                scene.options.forEach(opt => {
                    html += `
                        <button onclick="renderScene('${opt.next}')" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-game py-3 px-4 rounded-2xl shadow-md text-base pop-effect">
                            ${opt.text}
                        </button>
                    `;
                });
                html += `</div>`;

            } else if (scene.type === "pattern-quiz") {
                html += `
                    <div class="flex items-center justify-center gap-2 sm:gap-3 mb-6 p-4 bg-white rounded-xl border border-slate-200 shadow-inner select-none">
                        ${scene.sequence.map(emoji => `<span class="text-3xl sm:text-4xl">${emoji}</span>`).join(" ➔ ")}
                        <span class="text-3xl sm:text-4xl"> ➔ </span>
                        <span class="text-3xl sm:text-4xl font-bold text-pink-500 animate-pulse bg-pink-100 px-2.5 py-1 rounded-xl border-2 border-dashed border-pink-300">❓</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                `;
                scene.options.forEach(opt => {
                    const colorBtn = opt.text.includes("Rosso") ? "bg-red-500 hover:bg-red-600 text-white" : 
                                     opt.text.includes("Verde") ? "bg-green-500 hover:bg-green-600 text-white" : 
                                     "bg-blue-500 hover:bg-blue-600 text-white";
                    html += `
                        <button onclick="renderScene('${opt.next}')" 
                                class="${colorBtn} font-game py-3 px-4 rounded-2xl shadow-md text-base pop-effect">
                            ${opt.text}
                        </button>
                    `;
                });
                html += `</div>`;

            } else if (scene.type === "logic-size-quiz" || scene.type === "shape-quiz" || scene.type === "intruder-quiz" || scene.type === "number-sequence-quiz") {
                if (scene.type === "number-sequence-quiz") {
                    html += `
                        <div class="flex items-center justify-center gap-3 mb-6 p-4 bg-white rounded-xl border border-slate-200 shadow-inner select-none font-game text-2xl sm:text-3xl text-indigo-800">
                            <span>2</span> ➔ <span>4</span> ➔ <span>6</span> ➔ <span class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-xl border-2 border-dashed border-indigo-400 animate-pulse">?</span> ➔ <span>10</span>
                        </div>
                    `;
                }
                
                html += `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">`;
                scene.options.forEach(opt => {
                    html += `
                        <button onclick="renderScene('${opt.next}')" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-md text-sm sm:text-base pop-effect">
                            ${opt.text}
                        </button>
                    `;
                });
                html += `</div>`;

            } else {
                html += `<div class="flex flex-col gap-3">`;
                scene.choices.forEach(choice => {
                    const isEndingBtn = scene.isEnding;
                    const btnClass = isEndingBtn 
                        ? "bg-emerald-500 hover:bg-emerald-600 text-white font-game py-4 px-6 rounded-2xl shadow-lg pulse-soft text-lg text-center"
                        : "bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-md text-base sm:text-lg text-center";
                    
                    html += `
                        <button onclick="renderScene('${choice.next}')" 
                                class="${btnClass} pop-effect">
                            ${choice.text}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            html += `</div>`; // Fine div di animazione d'ingresso
            container.innerHTML = html;
            
            // Riporta lo scroll del contenitore in alto ad ogni cambio di scena
            container.scrollTop = 0;
        }

        // Avvio automatico del gioco al caricamento della pagina
        window.onload = function() {
            renderScene("intro");
        }
    </script>
</body>
</html>
