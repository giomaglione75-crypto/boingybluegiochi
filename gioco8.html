<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Il Bosco di Luminella — Storia 3D</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
    #container { width:100%; height:100%; display:block; position:relative; overflow:hidden; }
    canvas { display:block; } /* Three.js canvas */
    /* UI overlay */
    #ui {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 320px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(250,250,255,0.9));
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      color: #222;
    }
    #title { margin:0 0 6px 0; font-size:18px; }
    #story { margin:0 0 10px 0; line-height:1.3; }
    .choice { display:block; margin:6px 0; padding:8px 10px; border-radius:8px; border:0; background:#6ab04c; color:white; cursor:pointer; font-weight:600; }
    .choice.secondary { background:#4b7bd6; }
    #credits { margin-top:8px; font-size:12px; color:#444; opacity:0.9; }
    /* small help text bottom-right */
    #hint { position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,0.85); padding:8px 10px; border-radius:8px; font-size:13px; }
  </style>
</head>
<body>
  <div id="container"></div>

  <div id="ui" aria-live="polite">
    <h2 id="title">Il Bosco di Luminella</h2>
    <p id="story">C'era una volta Leo, un piccolo esploratore curioso. Una sera trovò un sentiero che brillava tra gli alberi.</p>
    <button id="opt1" class="choice">Segui il sentiero luminoso</button>
    <button id="opt2" class="choice secondary">Esplora il sentiero ombroso</button>
    <div id="credits">Clicca le scelte per far proseguire la storia</div>
  </div>

  <div id="hint">Usa il mouse per ruotare la vista</div>

  <!-- Three.js e OrbitControls (CDN) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

  <script>
  // Assicuriamoci che il DOM sia pronto
  window.addEventListener('DOMContentLoaded', () => {
    // --- Setup base Three.js ---
    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ad0ff); // cielo azzurro

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 3, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Controlli per esplorare la scena
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI / 2.1;

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Luci ---
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff7e6, 0.8);
    sun.position.set(5, 10, 2);
    scene.add(sun);

    // --- Terreno semplice ---
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x5fb85f });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    // Piccoli cespugli (decorazione)
    function makeBush(x,z,scale,color=0x2e8b57){
      const g = new THREE.SphereGeometry(1, 12, 10);
      const m = new THREE.MeshLambertMaterial({ color });
      const bush = new THREE.Mesh(g, m);
      bush.scale.setScalar(scale);
      bush.position.set(x, 0.5*scale, z);
      scene.add(bush);
    }
    makeBush(-3, -2, 0.8);
    makeBush(2, -3, 1.1);
    makeBush(4, 1, 0.7);

    // --- Personaggio "Leo" (gruppo di forme semplici) ---
    const leo = new THREE.Group();
    // corpo
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.6), new THREE.MeshLambertMaterial({ color: 0xffcc66 }));
    body.position.y = 0.9;
    leo.add(body);
    // testa
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), new THREE.MeshLambertMaterial({ color: 0xffe0c0 }));
    head.position.set(0, 1.7, 0);
    leo.add(head);
    // cappello
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.8, 12), new THREE.MeshLambertMaterial({ color: 0x4b7bd6 }));
    hat.position.set(0, 2.05, 0);
    hat.rotation.x = Math.PI;
    leo.add(hat);
    // posiziona Leo
    leo.position.set(0, 0, 0);
    scene.add(leo);

    // --- Albero magico (inizialmente spento) ---
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2, 12), new THREE.MeshLambertMaterial({ color: 0x8b5a2b }));
    trunk.position.y = 1;
    tree.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.6, 20, 16), new THREE.MeshLambertMaterial({ color: 0x2e8b57 }));
    leaves.position.y = 2.2;
    tree.add(leaves);
    tree.position.set(-6, 0, -6);
    scene.add(tree);

    // luce magica (spenta all'inizio)
    const magicLight = new THREE.PointLight(0xffdd66, 0, 6);
    magicLight.position.set(-6, 3, -6);
    scene.add(magicLight);

    // --- Sentiero luminoso (linea di sfere che brillano) ---
    const pathGroup = new THREE.Group();
    for (let i=0;i<10;i++){
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), new THREE.MeshBasicMaterial({ color: 0xfff1b6, transparent:true, opacity:0.9 }));
      s.position.set(-1 + i*0.9, 0.12, -1 - i*0.6);
      pathGroup.add(s);
    }
    pathGroup.visible = false; // nascosto all'inizio
    scene.add(pathGroup);

    // --- Effetto cielo notturno per il sentiero ombroso ---
    const darkSkyColor = new THREE.Color(0x0b1a2b);
    const daySkyColor = new THREE.Color(0x9ad0ff);

    // --- Stato della storia ---
    let state = 'start'; // start | luminoso | ombroso | fine

    // Funzione per aggiornare testo UI
    const storyEl = document.getElementById('story');
    const btn1 = document.getElementById('opt1');
    const btn2 = document.getElementById('opt2');

    function setChoices(text1, text2){
      if (text1) { btn1.style.display = 'block'; btn1.textContent = text1; } else btn1.style.display = 'none';
      if (text2) { btn2.style.display = 'block'; btn2.textContent = text2; } else btn2.style.display = 'none';
    }

    // Animazione semplice per muovere Leo verso una posizione
    let moveTarget = null;
    function moveLeoTo(x,z,duration=1200){
      const start = { x: leo.position.x, z: leo.position.z, t: performance.now() };
      moveTarget = { x, z, start, duration };
    }

    // --- Eventi delle scelte ---
    btn1.addEventListener('click', () => {
      if (state === 'start') {
        // scelta: sentiero luminoso
        state = 'luminoso';
        storyEl.textContent = "Leo segue il sentiero che brilla. Il bosco si fa più calmo e le luci sembrano guidarlo.";
        setChoices("Avvicinati all'albero magico", "Cerca una sorpresa tra i cespugli");
        // mostra sentiero e schiarisci cielo
        pathGroup.visible = true;
        // cambia cielo gradualmente
        animateSky(daySkyColor, 800);
        // muovi Leo lungo il sentiero
        moveLeoTo(-3.5, -2.2, 1800);
      } else if (state === 'luminoso') {
        // avvicinati all'albero magico
        state = 'albero';
        storyEl.textContent = "Leo tocca l'albero magico: una luce dorata esplode e l'albero si risveglia.";
        setChoices("Ascolta la voce dell'albero", null);
        // accendi luce magica
        fadeInMagicLight();
        // cambia colore di Leo (diventa dorato)
        body.material.color.set(0xffe08a);
      } else if (state === 'albero') {
        // ascolta la voce -> finale luminoso
        state = 'fine';
        storyEl.textContent = "L'albero racconta una storia antica e dona a Leo una piccola lanterna. Leo torna a casa felice.";
        setChoices(null, null);
        // piccola animazione di allontanamento
        moveLeoTo(-8, -6, 2000);
      }
    });

    btn2.addEventListener('click', () => {
      if (state === 'start') {
        // scelta: sentiero ombroso
        state = 'ombroso';
        storyEl.textContent = "Leo sceglie il sentiero ombroso. Le ombre si allungano e il bosco sussurra.";
        setChoices("Accendi la torcia", "Torna indietro");
        // scurisce il cielo
        animateSky(darkSkyColor, 900);
        // muovi Leo un po' verso il lato oscuro
        moveLeoTo(2.5, -3.2, 1400);
      } else if (state === 'ombroso') {
        // accendi la torcia -> scopri una creatura amichevole
        state = 'creatura';
        storyEl.textContent = "Con la torcia Leo scopre una piccola creatura che tremava. Diventano amici.";
        setChoices("Portala con te", "Lascia che resti nel bosco");
        // aggiungi una piccola creatura (sfera luminosa)
        addCreature(3, 0.6, -4);
      } else if (state === 'creatura') {
        // porta con te -> finale alternativo
        state = 'fine';
        storyEl.textContent = "Leo porta la creatura a casa. La creatura illumina le notti e Leo non si sente più solo.";
        setChoices(null, null);
        moveLeoTo(6, 4, 2000);
      } else if (state === 'ombroso' && btn2.textContent === 'Torna indietro') {
        // torna indietro al punto iniziale
        state = 'start';
        storyEl.textContent = "Leo torna al punto di partenza, il bosco sembra diverso ma accogliente.";
        setChoices("Segui il sentiero luminoso", "Esplora il sentiero ombroso");
        animateSky(daySkyColor, 700);
        pathGroup.visible = false;
        moveLeoTo(0,0,900);
      }
    });

    // Funzione per aggiungere una creatura amichevole
    function addCreature(x,y,z){
      if (scene.getObjectByName('creatura')) return;
      const g = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), new THREE.MeshStandardMaterial({ color: 0xff88cc, emissive: 0xff88cc, emissiveIntensity: 0.6 }));
      g.position.set(x,y,z);
      g.name = 'creatura';
      scene.add(g);
      // piccola oscillazione
      g.userData.osc = Math.random()*1000;
    }

    // Animazione cielo (lerp colore)
    let skyAnim = null;
    function animateSky(targetColor, ms=800){
      const start = { r: scene.background.r, g: scene.background.g, b: scene.background.b, t: performance.now() };
      const end = { r: targetColor.r, g: targetColor.g, b: targetColor.b };
      skyAnim = { start, end, ms };
    }

    // Accendi luce magica gradualmente
    function fadeInMagicLight(){
      const start = performance.now();
      const dur = 1200;
      const initial = magicLight.intensity;
      const target = 1.6;
      const tick = () => {
        const now = performance.now();
        const p = Math.min(1, (now - start) / dur);
        magicLight.intensity = initial + (target - initial) * p;
        leaves.material = leaves.material || new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
        leaves.material.color.lerp(new THREE.Color(0xfff0b0), p*0.6);
        if (p < 1) requestAnimationFrame(tick);
      };
      tick();
    }

    // --- Loop di animazione ---
    const clock = new THREE.Clock();
    function render(){
      requestAnimationFrame(render);
      const dt = clock.getDelta();

      // aggiorna controlli
      controls.update();

      // muovi Leo se richiesto (semplice easing)
      if (moveTarget){
        const now = performance.now();
        const elapsed = now - moveTarget.start.t;
        const p = Math.min(1, elapsed / moveTarget.duration);
        leo.position.x = moveTarget.start.x + (moveTarget.x - moveTarget.start.x) * easeOutCubic(p);
        leo.position.z = moveTarget.start.z + (moveTarget.z - moveTarget.start.z) * easeOutCubic(p);
        // ruota leggermente verso la direzione
        const dx = moveTarget.x - leo.position.x;
        const dz = moveTarget.z - leo.position.z;
        leo.rotation.y = Math.atan2(dx, dz) * 0.6;
        if (p >= 1) moveTarget = null;
      }

      // animazione sentiero (pulsazione)
      if (pathGroup.visible){
        const t = performance.now() * 0.002;
        pathGroup.children.forEach((s,i) => {
          s.material.opacity = 0.6 + 0.4 * Math.sin(t + i*0.6);
          s.scale.setScalar(0.9 + 0.12 * Math.sin(t + i*0.6));
        });
      }

      // animazione creatura se presente
      const creature = scene.getObjectByName('creatura');
      if (creature){
        creature.userData.osc += dt * 2;
        creature.position.y = 0.6 + Math.sin(creature.userData.osc) * 0.12;
      }

      // anima cielo se richiesto
      if (skyAnim){
        const now = performance.now();
        const p = Math.min(1, (now - skyAnim.start.t) / skyAnim.ms);
        const r = lerp(skyAnim.start.r, skyAnim.end.r, p);
        const g = lerp(skyAnim.start.g, skyAnim.end.g, p);
        const b = lerp(skyAnim.start.b, skyAnim.end.b, p);
        scene.background.setRGB(r,g,b);
        if (p >= 1) skyAnim = null;
      }

      renderer.render(scene, camera);
    }
    render();

    // --- Utility ---
    function lerp(a,b,t){ return a + (b-a)*t; }
    function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  }); // DOMContentLoaded end
  </script>
</body>
</html>
